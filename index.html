<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerCAD Web</title>
<link rel="stylesheet" href="style.css?v=editor-5">
<header>
  <h1>LayerCAD <span>Web</span></h1>
  <label class="open">Open model<input id="file" type="file" accept=".layercad,.stl"></label>
  <button id="export" type="button" disabled>Export STL</button>
  <button id="save" type="button" disabled>Save project</button>
  <button id="fit" type="button">Fit view</button>
</header>
<nav aria-label="Build tools">
  <span class="mode" id="mode">Build Mode</span>
  <button id="start-sketch" type="button">New sketch</button>
  <button id="edit-sketch" type="button" disabled>Edit sketch</button>
  <button id="face-sketch" type="button" disabled>Sketch on face</button>
  <button id="extrude-part" type="button" disabled>Extrude</button>
  <button id="primitive" type="button">Primitives</button>
  <select id="model-tool" aria-label="Modeling tool" disabled>
    <option value="">Create solid…</option><option>Sphere</option><option>Torus</option>
    <option>Coil</option><option>Revolve</option><option>Loft</option><option>Sweep</option><option>Pipe</option>
  </select>
  <button id="pattern" type="button" disabled>Linear pattern</button>
  <button id="hole" type="button" disabled>Hole</button>
  <button id="bevel" type="button" disabled>Bevel</button>
  <button id="move-part" type="button" disabled>Move</button>
  <button id="remove-part" type="button" disabled>Delete</button>
  <button id="undo" type="button" disabled>Undo</button>
  <button id="redo" type="button" disabled>Redo</button>
</nav>
<main>
  <div id="workspace">
  <aside><h2>Parts</h2><div id="parts"></div></aside>
  <div id="viewport">
  <canvas id="view" aria-label="3D model viewport"></canvas>
  <section id="sketch" hidden>
    <svg id="sketch-plane" viewBox="0 0 220 220" aria-label="XY sketch plane, 220 millimeters square">
      <defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 H 0 V 10" fill="none" stroke="#29415a" stroke-width=".4"/></pattern></defs>
      <rect width="220" height="220" fill="url(#grid)"/>
      <image id="reference-overlay" preserveAspectRatio="none" pointer-events="none"/>
      <path d="M110 0 V220 M0 110 H220" stroke="#4e7591" stroke-width=".5"/>
      <path id="face-guide" fill="none" stroke="#9eb7d1" stroke-width=".6" stroke-dasharray="2 1"/>
      <circle cx="110" cy="110" r="1.3" fill="#c3e7ff"/>
      <polygon id="outline"/>
      <g id="vertices"></g>
    </svg>
    <div class="sketch-tools">
      <label class="open">Reference image<input id="reference-file" type="file" accept="image/png,image/jpeg"></label>
      <button id="reference-settings" type="button" disabled>Image settings</button>
      <button id="reference-calibrate" type="button" disabled>Calibrate image</button>
      <button id="reference-remove" type="button" disabled>Remove image</button>
      <label>Shape <select id="shape"><option>Polygon</option><option>Rectangle</option><option>Circle</option><option>Open path</option></select></label>
      <label>Plane <select id="plane-choice"><option>XY</option><option>XZ</option><option>YZ</option></select></label>
      <label>Offset (mm) <input id="plane-offset" type="number" min="-10000" max="10000" step="any" value="0"></label>
      <label>Height (mm) <input id="height" type="number" min="0.01" max="10000" step="any" value="10"></label>
      <button id="undo-point" type="button">Undo point</button>
      <button id="extrude" type="button">Extrude</button>
      <button id="finish-sketch" type="button">Finish sketch</button>
      <button id="cancel-sketch" type="button">Cancel</button>
    </div>
  </section>
  </div>
  </div>
  <p id="status" role="status">Open a model or start a new sketch.</p>
</main>
<script src="sketch.js?v=editor-4" defer></script><script src="viewer.js?v=editor-9" defer></script>
</html>
