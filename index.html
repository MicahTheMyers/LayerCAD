<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerCAD Web</title>
<link rel="stylesheet" href="style.css?v=workspace-2">
<header><details><summary>File ▾</summary><div class="tool-popover"><button type="button" id="new-project">New project</button><label class="open">Open model<input id="file" type="file" accept=".layercad,.stl"></label><button id="save" type="button" disabled>Save project</button></div></details>
  <h1><img src="layercad.ico" width="36" height="36" alt="">LayerCAD</h1>
  <button id="export" type="button" disabled>Export STL</button>
  <details class="settings"><summary aria-label="Settings" title="Settings">⚙</summary><div class="tool-popover">
    <button id="build-volume" type="button">Build volume…</button>
  </div></details>
</header>
<div class="mode" id="mode">Build Mode</div>
<nav id="build-tools" aria-label="Build tools"><div class="ribbon-group" role="group" aria-label="Create"><div class="ribbon-row"><button id="start-sketch" class="ribbon-icon" aria-label="Create sketch" title="Create sketch" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5h15M6 17l2 1 11-11-2-2-11 11z"/></svg></button><button id="extrude-part" class="ribbon-icon" aria-label="Extrude" title="Extrude" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10M12 9V1m-3 3 3-3 3 3"/></svg></button><button id="hole" class="ribbon-icon" aria-label="Hole" title="Hole" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l11-4 7 5v9l-10 4-8-4zM8 9a3 2 0 1 0 6 0 3 2 0 1 0-6 0"/></svg></button><button id="thread" class="ribbon-icon" aria-label="Thread" title="Thread" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5c0-4 14-4 14 0s-14 4-14 0v14c0 4 14 4 14 0V5M5 10c0 4 14 4 14 0M5 15c0 4 14 4 14 0"/></svg></button><details><summary>More ▾</summary><div class="tool-popover"><button id="edit-sketch" type="button" disabled>Edit sketch</button><select id="model-tool" aria-label="Modeling tool" disabled>
    <option value="">Create solid…</option><option>Sphere</option><option>Torus</option>
    <option>Coil</option><option>Revolve</option><option>Loft</option><option>Sweep</option><option>Pipe</option>
    <option>Rib</option><option>Web</option>
  </select></div></details></div><span>Create</span></div><div class="ribbon-group" role="group" aria-label="Modify"><div class="ribbon-row"><button id="bevel" class="ribbon-icon" aria-label="Bevel" title="Bevel" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l9-3 7 6v9l-9 3-7-5zM13 3v10l7 5M4 16l9-3"/></svg></button><button id="move-part" class="ribbon-icon" aria-label="Move" title="Move" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/></svg></button><details><summary>More ▾</summary><div class="tool-popover"><button id="pattern" type="button" disabled>Linear pattern</button><button id="combine" type="button" disabled>Combine</button><button id="shell" type="button" disabled>Shell</button><button id="split-body" type="button" disabled>Split Body</button><button id="scale-body" type="button" disabled>Scale</button><button id="mirror-body" type="button" disabled>Mirror</button><button id="circular-pattern" type="button" disabled>Circular pattern</button><button id="remove-part" type="button" disabled>Delete</button></div></details></div><span>Modify</span></div><div class="ribbon-group" role="group" aria-label="Primitives"><div class="ribbon-row"><button id="primitive" class="ribbon-icon" aria-label="Primitives" title="Primitives" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg></button></div><span>Primitives</span></div><div class="ribbon-group" role="group" aria-label="Construct"><div class="ribbon-row"><button id="face-sketch" class="ribbon-icon" aria-label="Sketch on face" title="Sketch on face" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12l10-6 10 6-10 6zM12 3v18"/></svg></button></div><span>Construct</span></div><div class="ribbon-row history"><button id="undo" type="button" disabled>Undo</button><button id="redo" type="button" disabled>Redo</button></div></nav>
<nav id="sketch-tools" aria-label="Sketch tools" hidden><div class="ribbon-group" role="group" aria-label="Create"><div class="ribbon-row"><button class="ribbon-icon" type="button" data-shape="Open path" aria-label="Polyline" title="Polyline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18V7l8 5 10-8"/></svg></button><button class="ribbon-icon" type="button" data-shape="Circle" aria-label="Circle" title="Circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></button><button class="ribbon-icon" type="button" data-shape="Rectangle" aria-label="Rectangle" title="Rectangle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z"/></svg></button><button class="ribbon-icon" type="button" data-shape="Triangle" aria-label="Triangle" title="Triangle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 17H3z"/></svg></button><button class="ribbon-icon" type="button" data-shape="Polygon" aria-label="Polygon" title="Polygon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l5 8-5 8H7l-5-8z"/></svg></button></div><span>Create</span></div><div class="ribbon-group" role="group" aria-label="Modify"><div class="ribbon-row"><details><summary>Extrude</summary><div class="tool-popover">
      <label>Distance (mm) <input id="height" type="number" min="-10000" max="10000" step="any" value="10"></label>
      <label>Operation <select id="sketch-extrude-operation"><option>Add</option><option>Cut</option><option>Merge</option></select></label>
      <button id="extrude" type="button">Extrude</button>
      </div></details><details><summary>Constraints</summary><div class="tool-popover">

      <select id="constraint-rule" aria-label="Apply constraint" disabled>
        <option value="">Constrain…</option><option value="0">Horizontal edge</option>
        <option value="1">Vertical edge</option><option value="2">Coincident with origin</option>
        <option value="clear">Clear constraints</option>
      </select>
  </div></details></div><span>Modify</span></div><div class="ribbon-row"><button id="undo-point" type="button">Undo</button><button id="redo-point" type="button" disabled>Redo</button></div><div class="sketch-actions">
    <button id="cancel-sketch" type="button">Cancel sketch</button>
    <button id="finish-sketch" type="button">Finish sketch</button>
  </div><select id="shape" hidden><option>Polygon</option><option>Rectangle</option><option>Circle</option><option>Triangle</option><option>Open path</option></select></nav>
<main>
  <div id="workspace">
  <aside id="parts-panel"><h2>Parts <button id="toggle-parts" type="button" aria-label="Collapse Parts" aria-expanded="true">‹</button></h2><div id="parts"></div></aside>
  <div id="viewport">
  <div id="view-controls"><div class="view-cube" role="group" aria-label="View orientation"><button type="button" data-view="top">Top</button><button type="button" data-view="front">Front</button><button type="button" data-view="right">Right</button></div><button id="fit" type="button">Reset view</button></div>
  <output id="volume-label"></output>
  <canvas id="view" aria-label="3D model viewport"></canvas>
  <section id="sketch" hidden>
    <svg id="sketch-plane" viewBox="0 0 220 220" aria-label="XY sketch plane, 220 millimeters square">
      <defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 H 0 V 10" fill="none" stroke="#29415a" stroke-width=".4"/></pattern></defs>
      <g id="sketch-surface">
      <rect width="220" height="220" fill="#1b2737"/>
      <rect width="220" height="220" fill="url(#grid)" stroke="#52677e" stroke-width=".45"/>
      <image id="reference-overlay" preserveAspectRatio="none" pointer-events="none"/>
      <path d="M110 0 V220" stroke="#4b8474" stroke-width=".45"/><path d="M0 110 H220" stroke="#8a6265" stroke-width=".45"/>
      <path id="face-guide" fill="none" stroke="#9eb7d1" stroke-width=".6" stroke-dasharray="2 1"/>
      <circle cx="110" cy="110" r="1.1" fill="#122438" stroke="#83cbff" stroke-width=".5"/><text x="112" y="114" fill="#83cbff" font-size="2.8">Origin</text>
      <polygon id="outline"/>
      <polyline id="sketch-preview" fill="none" stroke="#83cbff" stroke-width=".7" pointer-events="none"/>
      <g id="vertices"></g>
      </g>
    </svg>

  </section>
  </div>
  <aside id="vertices-panel" hidden><h2>Vertices</h2><details><summary>Reference image</summary><div class="tool-popover">
      <label class="open">Choose image<input id="reference-file" type="file" accept="image/png,image/jpeg"></label>
      <button id="reference-settings" type="button" disabled>Image settings</button>
      <button id="reference-calibrate" type="button" disabled>Calibrate image</button>
      <button id="reference-remove" type="button" disabled>Remove image</button>
      </div></details><label>Plane <select id="plane-choice"><option>XY</option><option>XZ</option><option>YZ</option></select></label>
      <label>Offset (mm) <input id="plane-offset" type="number" min="-10000" max="10000" step="any" value="0"></label>
    <div class="vertex-coordinates"><label>X (mm)<input id="vertex-x" type="number" step="any" value="0"></label><label>Y (mm)<input id="vertex-y" type="number" step="any" value="0"></label></div>
    <div class="vertex-coordinates"><button id="add-vertex" type="button">Add point</button><button id="move-vertex" type="button">Move selected</button></div>
    <select id="constraint-vertex" aria-label="Vertices" size="8"></select>
    <button id="remove-vertex" type="button">Remove selected point</button>
  </aside>
  </div>
  <p id="status" role="status">Open a model or start a new sketch.</p>
</main>
<script src="sketch.js?v=editor-5" defer></script><script src="viewer.js?v=workspace-2" defer></script>
</html>
