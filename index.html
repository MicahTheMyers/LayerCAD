<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerCAD Web</title>
<link rel="stylesheet" href="style.css?v=editor-2">
<header>
  <h1>LayerCAD <span>Web</span></h1>
  <label class="open">Open model<input id="file" type="file" accept=".layercad,.stl"></label>
  <button id="start-sketch" type="button">New sketch</button>
  <button id="export" type="button" disabled>Export STL</button>
  <button id="save" type="button" disabled>Save project</button>
  <button id="fit" type="button">Fit view</button>
</header>
<main>
  <canvas id="view" aria-label="3D model viewport"></canvas>
  <section id="sketch" hidden>
    <svg id="sketch-plane" viewBox="0 0 220 220" aria-label="XY sketch plane, 220 millimeters square">
      <defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 H 0 V 10" fill="none" stroke="#29415a" stroke-width=".4"/></pattern></defs>
      <rect width="220" height="220" fill="url(#grid)"/>
      <path d="M110 0 V220 M0 110 H220" stroke="#4e7591" stroke-width=".5"/>
      <polygon id="outline"/>
      <g id="vertices"></g>
    </svg>
    <div class="sketch-tools">
      <label>Shape <select id="shape"><option>Polygon</option><option>Rectangle</option><option>Circle</option></select></label>
      <label>Height (mm) <input id="height" type="number" min="0.01" max="10000" step="any" value="10"></label>
      <button id="undo-point" type="button">Undo point</button>
      <button id="extrude" type="button">Extrude</button>
      <button id="cancel-sketch" type="button">Cancel</button>
    </div>
  </section>
  <p id="status" role="status">Open a model or start a new sketch.</p>
</main>
<script src="sketch.js?v=editor-3" defer></script><script src="viewer.js?v=editor-3" defer></script>
</html>
