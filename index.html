<div class="mode" id="mode">Build Mode</div>

    <option>Coil</option><option>Revolve</option><option>Loft</option><option>Sweep</option><option>Pipe</option>
    <option>Rib</option><option>Web</option>
  </select></div></details></div><span>Create</span></div><div class="ribbon-group" role="group" aria-label="Modify"><div class="ribbon-row"><button id="bevel" class="ribbon-icon" aria-label="Bevel" title="Bevel" type="button" disabled><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M 4,11 H 12 L 17,16 V 26 H 4 Z" fill="#5182A8" stroke="none"/><path d="M 17,16 L 27,9 V 19 L 17,26 Z" fill="#375A7B" stroke="none"/><path d="M 4,11 L 14,4 H 22 L 12,11 Z" fill="#8FBFE2" stroke="none"/><path d="M 12,11 L 22,4 L 27,9 L 17,16 Z" fill="#FFD084" stroke="none"/><path d="M 4,11 L 14,4 H 22 L 27,9 V 19 L 17,26 H 4 Z M 4,11 H 12 L 22,4 M 12,11 L 17,16 L 27,9 M 17,16 V 26" fill="none" stroke="#D3E8FA" stroke-width="1.15"/></svg></button><button id="move-part" class="ribbon-icon" aria-label="Move" title="Move" type="button" disabled><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M 12,12 H 18 V 18 H 12 Z" fill="#548DB4" stroke="none"/><path d="M 3,15 H 27 M 7,11 L 3,15 L 7,19 M 23,11 L 27,15 L 23,19 M 15,3 V 27 M 11,7 L 15,3 L 19,7 M 11,23 L 15,27 L 19,23" fill="none" stroke="#E6EDF6" stroke-width="1.5"/></svg></button><details><summary>More ▾</summary><div class="tool-popover"><button id="pattern" type="button" disabled>Linear pattern</button><button id="combine" type="button" disabled>Combine</button><button id="shell" type="button" disabled>Shell</button><button id="split-body" type="button" disabled>Split Body</button><button id="scale-body" type="button" disabled>Scale</button><button id="mirror-body" type="button" disabled>Mirror</button><button id="circular-pattern" type="button" disabled>Circular pattern</button><button id="remove-part" type="button" disabled>Delete</button></div></details></div><span>Modify</span></div><div class="ribbon-group" role="group" aria-label="Primitives"><div class="ribbon-row"><button id="primitive" class="ribbon-icon" aria-label="Primitives" title="Primitives" type="button"><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M 3,9 L 15,3 L 27,9 V 22 L 15,28 L 3,22 Z" fill="#548DB4" stroke="none"/><path d="M 3,9 L 15,15 L 27,9 M 15,15 V 28" fill="none" stroke="#BDE6FF" stroke-width="1.5"/></svg></button></div><span>Primitives</span></div><div class="ribbon-group" role="group" aria-label="Construct"><div class="ribbon-row"><button id="face-sketch" class="ribbon-icon" aria-label="Sketch on face" title="Sketch on face" type="button" disabled><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M 3,19 L 18,12 L 28,17 L 13,24 Z" fill="#548DB4" stroke="none"/><path d="M 3,12 L 18,5 L 28,10 L 13,17 Z M 15,19 V 7 M 12,10 L 15,7 L 18,10" fill="none" stroke="#B2EAD0" stroke-width="1.5"/></svg></button></div><span>Construct</span></div><div class="ribbon-row history"><button id="undo" type="button" disabled>Undo</button><button id="redo" type="button" disabled>Redo</button></div></nav>
<nav id="sketch-tools" aria-label="Sketch tools" hidden><div class="ribbon-group" role="group" aria-label="Create"><div class="ribbon-row"><button class="ribbon-icon" type="button" data-shape="Open path" aria-label="Polyline" title="Polyline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 3,19 L 3,8 L 11,12 L 20,3" fill="none" stroke="#EDF3FC" stroke-width="1.7"/></svg></button><button class="ribbon-icon" type="button" data-shape="Circle" aria-label="Circle" title="Circle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 12,3 A 9,9 0 1 1 11.99,3 Z" fill="none" stroke="#EDF3FC" stroke-width="1.7"/></svg></button><button class="ribbon-icon" type="button" data-shape="Rectangle" aria-label="Rectangle" title="Rectangle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 2,6 H 22 V 18 H 2 Z" fill="none" stroke="#EDF3FC" stroke-width="1.7"/></svg></button><button class="ribbon-icon" type="button" data-shape="Triangle" aria-label="Triangle" title="Triangle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 12,3 L 22,21 H 2 Z" fill="none" stroke="#EDF3FC" stroke-width="1.7"/></svg></button><button class="ribbon-icon" type="button" data-shape="Polygon" aria-label="Polygon" title="Polygon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M 7,3 H 17 L 22,12 L 17,21 H 7 L 2,12 Z" fill="none" stroke="#EDF3FC" stroke-width="1.7"/></svg></button></div><span>Create</span></div><div class="ribbon-group" role="group" aria-label="Modify"><div class="ribbon-row"><details><summary>Extrude</summary><div class="tool-popover">
      <label>Distance (mm) <input id="height" type="number" min="-10000" max="10000" step="any" value="10"></label>
      <label>Operation <select id="sketch-extrude-operation"><option>Add</option><option>Cut</option><option>Merge</option></select></label>
      <button id="extrude" type="button">Extrude</button>
      </div></details><details><summary>Constraints</summary><div class="tool-popover">

      <select id="constraint-rule" aria-label="Apply constraint" disabled>
        <option value="">Constrain…</option><option value="0">Horizontal edge</option>
        <option value="1">Vertical edge</option><option value="2">Coincident with origin</option>
        <option value="clear">Clear constraints</option>
      </select>
  </div></details></div><span>Modify</span></div><div class="ribbon-row"><button id="undo-point" type="button">Undo</button><button id="redo-point" type="button" disabled>Redo</button></div><div class="sketch-actions">
    <button id="cancel-sketch" type="button">Cancel sketch</button>
    <button id="finish-sketch" type="button">Finish sketch</button>
  </div><select id="shape" hidden><option>Polygon</option><option>Rectangle</option><option>Circle</option><option>Triangle</option><option>Open path</option></select></nav>
<main>
  <div id="workspace">
  <aside id="parts-panel"><h2>Parts <button id="toggle-parts" type="button" aria-label="Collapse Parts" aria-expanded="true">‹</button></h2><div id="parts"></div></aside>
  <div id="viewport">
  <div id="view-controls"><svg id="view-cube" class="view-cube" viewBox="0 0 88 88" role="group" aria-label="View orientation. Drag to orbit or click a face."></svg><button id="fit" type="button">Reset view</button></div>
  <output id="volume-label"></output>
  <form id="build-extrude" hidden aria-label="Extrude">
    <strong>Extrude</strong>
    <p id="extrude-target" aria-live="polite"></p>
    <label>Distance (mm) <input id="build-extrude-distance" type="number" step="any" value="10" required></label>
    <label>Operation <select id="build-extrude-operation"><option>Add</option><option>Cut</option><option>Merge</option></select></label>
    <p id="extrude-error" role="alert"></p>
    <div><button id="cancel-extrude" type="button">Cancel</button><button id="apply-extrude" type="submit">Apply</button></div>
  </form>
  <canvas id="view" aria-label="3D model viewport"></canvas>
  <svg id="detail-overlay" aria-hidden="true"></svg>
  <svg id="extrude-overlay" aria-hidden="true"><path id="extrude-arrow"/></svg>
  <div id="plane-selector" hidden>
    <svg id="plane-targets" aria-hidden="true"></svg>
    <div role="group" aria-label="Sketch plane">
      <button type="button" data-plane="XY">XY</button>
      <button type="button" data-plane="XZ">XZ</button>
      <button type="button" data-plane="YZ">YZ</button>
      <button type="button" id="cancel-plane">Cancel</button>
    </div>
  </div>
  <section id="sketch" hidden>
    <svg id="sketch-plane" aria-label="Sketch plane">
      <defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 H 0 V 10" fill="none" stroke="#29415a" stroke-width=".4"/></pattern></defs>
      <g id="sketch-surface">
      <rect width="220" height="220" fill="#26394c" fill-opacity=".18"/>
      <rect width="220" height="220" fill="url(#grid)" stroke="#52677e" stroke-width=".45"/>
      <image id="reference-overlay" preserveAspectRatio="none" pointer-events="none"/>
      <path d="M110 0 V220" stroke="#4b8474" stroke-width=".45"/><path d="M0 110 H220" stroke="#8a6265" stroke-width=".45"/>
      <path id="face-guide" fill="none" stroke="#9eb7d1" stroke-width=".6" stroke-dasharray="2 1"/>
      <g id="sketch-drawings"></g>
      <circle cx="110" cy="110" r="1.1" fill="#122438" stroke="#83cbff" stroke-width=".5"/><text x="112" y="114" fill="#83cbff" font-size="2.8">Origin</text>
      <polygon id="outline"/>
      <polyline id="sketch-preview" fill="none" stroke="#83cbff" stroke-width=".7" pointer-events="none"/>
      <g id="vertices"></g>
      </g>
    </svg>

  </section>
  </div>
  <aside id="vertices-panel" hidden><h2>Vertices</h2><details><summary>Reference image</summary><div class="tool-popover">
      <label class="open">Choose image<input id="reference-file" type="file" accept="image/png,image/jpeg"></label>
      <button id="reference-settings" type="button" disabled>Image settings</button>
      <button id="reference-calibrate" type="button" disabled>Calibrate image</button>
      <button id="reference-remove" type="button" disabled>Remove image</button>
      </div></details><label>Plane <select id="plane-choice"><option>XY</option><option>XZ</option><option>YZ</option></select></label>
      <label>Offset (mm) <input id="plane-offset" type="number" min="-10000" max="10000" step="any" value="0"></label>
    <div class="vertex-coordinates"><label>X (mm)<input id="vertex-x" type="number" step="any" value="0"></label><label>Y (mm)<input id="vertex-y" type="number" step="any" value="0"></label></div>
    <div class="vertex-coordinates"><button id="add-vertex" type="button">Add point</button><button id="move-vertex" type="button">Move selected</button></div>
    <select id="constraint-vertex" aria-label="Vertices" size="8"></select>
    <button id="remove-vertex" type="button">Remove selected point</button>
    <label>Drawing <select id="sketch-drawing-choice"></select></label>
    <button id="add-sketch-drawing" type="button">Start another drawing</button>
  </aside>
  </div>
  <p id="status" role="status">Open a model or start a new sketch.</p>
</main>
<dialog id="feature-dialog" aria-labelledby="feature-title">
  <form id="feature-form">
    <strong id="feature-title"></strong>
    <label id="feature-amount-label"><span></span> <input id="feature-amount" type="number" min="0" step="any" required></label>
    <label id="feature-bevel-style-label" hidden>Style <select id="feature-bevel-style"><option>Flat</option><option>Rounded</option></select></label>
    <label id="feature-surface-label" hidden>Surface <select id="feature-surface"></select></label>
    <label id="feature-metric-label" hidden>Metric size <input id="feature-metric" list="metric-sizes" placeholder="Auto match"></label>
    <datalist id="metric-sizes"><option>M2</option><option>M2.5</option><option>M3</option><option>M4</option><option>M5</option><option>M6</option><option>M8</option><option>M10</option><option>M12</option><option>Custom</option></datalist>
    <label id="feature-pitch-label" hidden>Pitch (mm) <input id="feature-pitch" type="number" min="0.01" step="any" value="1.5"></label>
    <label id="feature-depth-label" hidden>Radial depth (mm) <input id="feature-depth" type="number" min="0.01" step="any" value="0.7"></label>
    <p id="feature-error" role="alert"></p>
    <div><button id="cancel-feature" type="button">Cancel</button><button type="submit">Apply</button></div>
  </form>
</dialog>
<script src="sketch.js?v=editor-5" defer></script><script src="viewer.js?v=workspace-9" defer></script>
</html>
